# Static host for the bundled pcbjam + Protogon site.
#
# The KiCad WASM editor needs a cross-origin-isolated page (SharedArrayBuffer +
# pthreads), so COOP/COEP go on every response. Because every asset is served
# same-origin, no per-asset CORP/ACAO negotiation is needed. Two content traps:
#   - *.wasm must be application/wasm (keeps the streaming, low-peak-memory path)
#   - images.tar.gz is raw gzip KiCad gunzips itself -> octet-stream, and the host
#     must NOT add Content-Encoding or the in-JS gunzip fails ("incorrect header
#     check"). gzip is turned off for it.
# nginx footgun: any add_header inside a location DROPS inherited add_headers, so
# the three isolation headers are repeated in every location that sets its own.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # "Just open it": the app's "/" route redirects to the board client-side
    # (App.tsx <Navigate>), so serving index.html at the root is enough — no
    # server redirect needed, and it works the same at root or under a subpath.

    location ~ \.wasm$ {
        default_type application/wasm;
        gzip off;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    }

    # Raw gzip payload — never re-encode, never send Content-Encoding.
    location ~ \.tar\.gz$ {
        default_type application/octet-stream;
        gzip off;
        gzip_static off;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    }

    # Sparse 3D-model per-lib manifests are extensionless files named "manifest".
    location ~ /libs/kicad-models/.+/manifest$ {
        default_type application/json;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
